[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snowpack"
version = "0.1.0"
description = "Markdown to Typst PDF Document Compiler"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["markdown", "typst", "pdf", "pandoc", "compiler", "typesetting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "rime",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[project.scripts]
snowpack = "snowpack.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snowpack*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

